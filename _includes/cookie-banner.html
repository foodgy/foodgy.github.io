<div id="cookie-consent" class="hidden fixed inset-x-5 bottom-5 z-50 md:right-auto md:max-w-md font-sans p-4 rounded-xl shadow-framed bg-gray-200 dark:bg-[--callout-bg-color]">
    <div class="flex justify-between items-center gap-4">
        <p class="text-sm text-zinc-800 dark:text-white/90">
            Сайт использует <a class="border-b border-zinc-800/70 dark:border-white/70 hover:border-transparent" href="{{ site.privacy_policy }}" target="_blank" rel="nofollow">куки</a>.
        </p>
        <button id="cookie-consent-accept" type="button" class="shrink-0 py-1.5 px-4 text-sm text-gray-600 dark:text-white/90 border border-transparent rounded-lg bg-gray-300 hover:bg-gray-400/60 dark:bg-gray-500/60 dark:hover:bg-gray-500/40">
            Окей
        </button>
    </div>
</div>
<script>
    (function () {
        var banner = document.getElementById('cookie-consent');
        var match = document.cookie.match(/(?:^|; )_cp=([^;]*)/);

        if (match && match[1] === 'granted') return;

        banner.classList.remove('hidden');

        document.getElementById('cookie-consent-accept').addEventListener('click', function () {
            var date = new Date();
            date.setTime(date.getTime() + (180 * 24 * 60 * 60 * 1000));
            document.cookie = '_cp=granted; expires=' + date.toUTCString() + '; path=/';

            window.dataLayer = window.dataLayer || [];
            window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
            window.gtag('consent', 'update', {
                ad_storage: 'granted',
                ad_user_data: 'granted',
                ad_personalization: 'granted'
            });
            window.dataLayer.push({ event: 'consent_state_ready', consent_state: 'granted' });

            banner.remove();
        });
    })();
</script>
